services:
  postgres:
    image: 'postgres:15-alpine'
    container_name: 'academic_db'
    environment:
      - 'POSTGRES_DB=academic_management'
      - 'POSTGRES_PASSWORD=academic_password'
      - 'POSTGRES_USER=academic_user'
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/main/resources/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U academic_user -d academic_management"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
